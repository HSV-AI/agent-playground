name: CI

on: [push, pull_request]

env:
  OPENROUTER_API_KEY: 'NOT_A_REAL_KEY'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Install uv
        run: pip install uv
      - name: Sync repo
        run: uv sync
      - name: Run mypy
        run: uv run mypy src
      - name: Run tests
        run: uv run pytest
