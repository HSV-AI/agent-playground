name: CI

on: [push, pull_request]

env:
  OPENROUTER_API_KEY: 'NOT_A_REAL_KEY'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use a recent LTS version
      - name: Install MCP Server
        run: npm install -g @modelcontextprotocol/server-filesystem
      - name: Install uv
        run: pip install uv
      - name: Sync repo
        run: uv sync
      - name: Run mypy
        run: uv run mypy src
      - name: Run tests
        run: uv run pytest
