[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-playground"
version = "0.1.0"
description = "A playground environment for developing and testing agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "J. Langley"}
]
dependencies = [
    "pydantic-ai>=0.0.5",
    "requests>=2.28.0",
    "click>=8.1.0",
    "markdown>=3.4.0",
    "python-dotenv>=0.20.0",
    "poml>=0.0.8",
    "tomli>=2.0.0",
    "bs4>=0.0.2",
    "playwright>=1.55.0",
    "logfire>=4.13.0",
    "mcp-server-git>=2025.9.25",
    "pytest>=8.4.2",
    "setuptools>=80.9.0",
    "dirty-equals>=0.10.0",
    "anyio>=4.11.0",
    "pytest-asyncio>=1.2.0",
    "mypy>=1.18.2",
    "pytest-cov>=7.0.0",
]

[project.scripts]
agent-playground = "agent_playground.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.10.0",
    "mypy>=0.990",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# src-layout (recommended)
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

files = "src/"
ignore_missing_imports = true
disallow_untyped_calls = true
warn_return_any = true
